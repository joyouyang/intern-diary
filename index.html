<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D7E9FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1E2A" media="(prefers-color-scheme: dark)">
  <meta name="description" content="给实习生的每日成长日记：列待办、记一句心情，把今天折成纸船漂到广场，一键导出 Word / PDF / Markdown。">
  <title>实习成长日记</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="成长日记">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabbar" hidden aria-label="主导航">
    <div class="tabs">
      <button data-view="todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.5 1.5L7.5 5"/><path d="m3.5 12 1.5 1.5 2.5-2.5"/><path d="m3.5 18 1.5 1.5 2.5-2.5"/></svg>
        <span>待办</span>
      </button>
      <button data-view="diary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>日记</span>
      </button>
      <button data-view="plaza">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 14.5h19l-3.2 4.5H5.7z"/><path d="M7 14.5 12 4.5l5 10"/><path d="M12 4.5v10"/></svg>
        <span>广场</span>
      </button>
      <button data-view="inbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>通知</span>
        <i class="badge" hidden></i>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="10" r="3"/><path d="M6.4 18.2a6.6 6.6 0 0 1 11.2 0"/></svg>
        <span>我的</span>
      </button>
    </div>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <div id="print-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
