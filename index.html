<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F7A5C">
  <meta name="description" content="给实习生的每日成长日记：写日记、列计划、做时间复盘、连续打卡，一键导出 Word / PDF / Markdown。">
  <title>实习成长日记</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="成长日记">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabbar" hidden aria-label="主导航">
    <div class="tabs">
      <button data-view="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>
        <span>今天</span>
      </button>
      <button data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
        <span>日记</span>
      </button>
      <button data-view="streak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 3 2.5 4.7 4.2 6.5C17.7 11 18.5 12.6 18.5 14.6 18.5 18.2 15.6 21 12 21s-6.5-2.8-6.5-6.4c0-2.4 1.2-4.3 2.9-5.7.2 1.7.9 2.9 2.1 3.5C10.4 9.4 10.7 6 12 3z"/></svg>
        <span>打卡</span>
      </button>
      <button data-view="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span>导出</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>我的</span>
      </button>
    </div>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <div id="print-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
